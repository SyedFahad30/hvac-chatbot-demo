<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clermont Air & Heat — Job Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; background: #f7f5f3; color: #2b2b2b; }

  .topbar {
    background: #2b2b2b; color: #fff;
    padding: 18px 32px; display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  .topbar h1 { font-size: 18px; font-weight: normal; }
  .topbar .sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }

  #refreshBtn {
    background: #c1440e; color: #fff; border: none; border-radius: 6px;
    padding: 9px 16px; font-size: 13px; font-weight: bold; cursor: pointer;
  }
  #refreshBtn:disabled { opacity: 0.6; cursor: default; }

  .content { padding: 24px 32px; }
  #status { font-size: 13px; color: #6b6b63; margin-bottom: 14px; }
  #status.error { color: #b3261e; }

  table {
    width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  th, td { text-align: left; padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { background: #2b2b2b; color: #fff; font-weight: normal; position: sticky; top: 0; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #faf5ee; }

  .badge { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge.emergency { background: #fbdcd4; color: #b3261e; }
  .badge.routine { background: #e4f0e1; color: #2e6b2f; }
  .badge.web { background: #e6eef7; color: #1b4b63; }
  .badge.sms { background: #fbe6d8; color: #c1440e; }

  #emptyState { text-align: center; padding: 60px 20px; color: #6b6b63; font-size: 14px; display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>New Job Requests</h1>
    <div class="sub">Clermont Air &amp; Heat — live from the chatbot &amp; missed-call text-back</div>
  </div>
  <button id="refreshBtn" onclick="loadData()">Refresh</button>
</div>

<div class="content">
  <div id="status">Loading...</div>
  <div id="emptyState">No job requests captured yet. They'll appear here as soon as a visitor uses the chat widget or texts back after a missed call.</div>
  <table id="dataTable" style="display:none">
    <thead><tr id="headerRow"></tr></thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<script>
  const API_ENDPOINT = "https://4zqhnl45ej.execute-api.us-east-1.amazonaws.com/";

  async function loadData() {
    const status = document.getElementById("status");
    const table = document.getElementById("dataTable");
    const emptyState = document.getElementById("emptyState");
    const btn = document.getElementById("refreshBtn");

    btn.disabled = true;
    status.className = "";
    status.textContent = "Loading...";
    table.style.display = "none";
    emptyState.style.display = "none";

    try {
      const response = await fetch(API_ENDPOINT, { method: "GET" });
      if (!response.ok) throw new Error("Server returned " + response.status);
      const data = await response.json();
      const records = data.records || [];

      if (records.length === 0) {
        emptyState.style.display = "block";
        status.textContent = "Up to date — 0 records.";
      } else {
        renderTable(records);
        table.style.display = "table";
        status.textContent = `Up to date — ${records.length} record${records.length === 1 ? "" : "s"}, as of ${new Date().toLocaleTimeString()}.`;
      }
    } catch (err) {
      status.className = "error";
      status.textContent = "Couldn't load data: " + err.message;
    } finally {
      btn.disabled = false;
    }
  }

  function badgeFor(column, value) {
    const v = (value || "").toLowerCase();
    if (column === "Urgency" && v === "emergency") return `<span class="badge emergency">Emergency</span>`;
    if (column === "Urgency" && v === "routine") return `<span class="badge routine">Routine</span>`;
    if (column === "Channel" && v === "web") return `<span class="badge web">Website</span>`;
    if (column === "Channel" && v === "sms") return `<span class="badge sms">Text</span>`;
    return escapeHtml(value || "");
  }

  function renderTable(records) {
    const headerRow = document.getElementById("headerRow");
    const dataBody = document.getElementById("dataBody");
    const columns = Object.keys(records[0]);

    headerRow.innerHTML = columns.map(c => `<th>${escapeHtml(c)}</th>`).join("");

    const sorted = [...records].reverse();
    dataBody.innerHTML = sorted.map(record => {
      const cells = columns.map(c => `<td>${badgeFor(c, record[c])}</td>`).join("");
      return `<tr>${cells}</tr>`;
    }).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  loadData();
</script>

</body>
</html>
